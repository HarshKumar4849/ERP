name: TecMotiv QA

on:
  push:
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE: mongodb://127.0.0.1:27017/tecmotiv_qa
      JWT_SECRET: ci-only-qa-secret
      QA_RUN_ID: ci-${{ github.run_id }}
      QA_FIXTURE_PASSWORD: TecMotiv-QA-Only-2026!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run qa:smoke

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
    env:
      DATABASE: mongodb://127.0.0.1:27017/tecmotiv_qa
      PORT: 8899
      JWT_SECRET: ci-only-qa-secret
      QA_RUN_ID: ci-${{ github.run_id }}
      QA_FIXTURE_PASSWORD: TecMotiv-QA-Only-2026!
      NODE_ENV: test
      VITE_BACKEND_SERVER: http://127.0.0.1:8899/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Seed QA fixtures
        working-directory: backend
        run: npm run qa:seed
      - name: Start backend
        working-directory: backend
        run: nohup node src/server.js > ../backend-qa.log 2>&1 &
      - name: Wait for backend
        run: for i in {1..30}; do curl --silent http://127.0.0.1:8899/api/login >/dev/null && break; sleep 1; done
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: nohup npm run preview -- --host 127.0.0.1 --port 4173 > ../frontend-qa.log 2>&1 &
      - name: Wait for frontend
        run: for i in {1..30}; do curl --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run qa:e2e
      - name: Clean QA fixtures
        if: always()
        working-directory: backend
        run: npm run qa:cleanup
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tecmotiv-qa-reports
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/playwright-report.json
            backend-qa.log
            frontend-qa.log
